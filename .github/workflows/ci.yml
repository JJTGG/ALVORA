
name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "docs/**"
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          files=$(gofmt -l .)

          if [[ -n "$files" ]]; then
            echo "The following files are not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...
